<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin — StorCoin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/admin/css/admin.css" />
</head>
<body class="login-page">
  <div class="login-card">
    <div class="login-logo">🛒</div>
    <h1>Panel Admin</h1>
    <p class="login-sub">StorCoin</p>
    <form id="loginForm">
      <div class="form-group">
        <label>Usuario</label>
        <input type="text" id="username" placeholder="admin" required autocomplete="username" />
      </div>
      <div class="form-group">
        <label>Contraseña</label>
        <input type="password" id="password" placeholder="••••••••" required autocomplete="current-password" />
      </div>
      <div class="error-msg" id="loginError"></div>
      <button type="submit" class="btn-full" id="loginBtn">Ingresar</button>
    </form>
    <a href="/" class="back-link">← Volver al sitio</a>
  </div>
  <script>
    if (localStorage.getItem('storcoin_token')) window.location.href = '/admin/dashboard.html';
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('loginBtn');
      const err = document.getElementById('loginError');
      btn.textContent = 'Ingresando...'; btn.disabled = true; err.textContent = '';
      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            username: document.getElementById('username').value,
            password: document.getElementById('password').value,
          }),
        });
        const data = await res.json();
        if (!res.ok) throw new Error(data.error || 'Error');
        localStorage.setItem('storcoin_token', data.token);
        window.location.href = '/admin/dashboard.html';
      } catch (ex) {
        err.textContent = ex.message;
        btn.textContent = 'Ingresar'; btn.disabled = false;
      }
    });
  </script>
</body>
</html>
